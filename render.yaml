# Free demonstration. Render Free Postgres expires after 30 days.
services:
  - type: web
    name: farm-pro
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farm-pro-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "1"
      - key: PRIVATE_STORAGE
        value: /tmp/farm-pro-private
      - key: DATABASE_FILE_STORAGE
        value: "1"
      - key: LOW_MEMORY
        value: "1"
      - key: CSV_CHUNK_SIZE
        value: "10000"
databases:
  - name: farm-pro-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: farm_pro
    user: farm_pro
    ipAllowList: []
